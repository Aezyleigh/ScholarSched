<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScholarSched | Unida Christian Colleges</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Student view (no login) -->
  <div id="student-view" hidden>
    <header class="topbar">
      <div class="brand">
        <img src="img/logo.png" alt="Unida Christian Colleges crest">
        <div>
          <strong>ScholarSched</strong>
          <span id="student-period" class="muted"></span>
        </div>
      </div>
      <button id="show-login-btn" type="button">Staff log in</button>
    </header>
    <main class="content">
      <section>
        <h2>View your class schedule</h2>
        <div class="grid">
          <label>Program <select id="s-program"></select></label>
          <label>Year level <select id="s-year"></select></label>
          <label>Or search any subject <input type="search" id="s-search" placeholder="Code or name, e.g. CS101"></label>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Subject</th><th>Program and year</th><th>Teacher</th><th>Room</th><th>Day</th><th>Time</th></tr>
            </thead>
            <tbody id="student-body"></tbody>
          </table>
        </div>
        <p id="student-empty" class="muted">Choose your program and year level.</p>
      </section>
    </main>
  </div>

  <!-- Staff login -->
  <main id="login-view" class="login" hidden>
    <img class="crest" src="img/logo.png" alt="Unida Christian Colleges crest">
    <h1>ScholarSched</h1>
    <p class="muted">Staff log in</p>
    <form id="login-form">
      <label>Email <input type="email" id="login-email" required autocomplete="username"></label>
      <label>Password <input type="password" id="login-password" required autocomplete="current-password"></label>
      <button type="submit" class="primary">Log in</button>
    </form>
    <div id="login-error" class="alert error" role="alert" hidden></div>
    <button type="button" id="back-to-student">Back to student schedules</button>
  </main>

  <!-- App -->
  <div id="app-view" hidden>
    <header class="topbar">
      <div class="brand">
        <img src="img/logo.png" alt="Unida Christian Colleges crest">
        <div>
          <strong>ScholarSched</strong>
          <span id="period-label" class="muted"></span>
        </div>
      </div>
      <div>
        <span id="user-label" class="muted"></span>
        <button id="logout-btn" type="button">Log out</button>
      </div>
    </header>

    <main class="content">
      <!-- Program Head only -->
      <nav id="app-tabs" class="tabs" hidden>
        <button type="button" data-tab="schedules" aria-selected="true">Schedules</button>
        <button type="button" data-tab="reports" aria-selected="false">Reports</button>
      </nav>

      <div id="tab-schedules">
        <section id="create-panel" hidden>
          <h2 id="form-title">Create schedule</h2>
          <form id="schedule-form" class="grid">
            <label>Subject <select id="f-subject" required></select></label>
            <label>Program <select id="f-program" required></select></label>
            <label>Year level <select id="f-year" required></select></label>
            <label>Teacher <select id="f-teacher" required></select></label>
            <label>Room <select id="f-room" required></select></label>
            <label>Day
              <select id="f-day" required>
                <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
                <option>Thursday</option><option>Friday</option><option>Saturday</option>
              </select>
            </label>
            <label>Start time <input type="time" id="f-start" required></label>
            <label>End time <input type="time" id="f-end" required></label>
            <div class="form-actions">
              <button type="submit" id="form-submit" class="primary">Check conflicts and save as draft</button>
              <button type="button" id="form-cancel" hidden>Cancel editing</button>
            </div>
          </form>
          <div id="form-alert" class="alert" role="alert" hidden></div>
        </section>

        <section>
          <h2 id="list-title">Schedules</h2>
          <div class="toolbar">
            <label>Search schedules <input type="search" id="search-input" placeholder="Subject, teacher, room, day..."></label>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Subject</th><th>Program and year</th><th>Teacher</th><th>Room</th>
                  <th>Day</th><th>Time</th><th>Status</th><th class="admin-only">Actions</th>
                </tr>
              </thead>
              <tbody id="schedule-body"></tbody>
            </table>
          </div>
          <p id="empty-msg" class="muted" hidden></p>
        </section>
      </div>

      <div id="tab-reports" hidden>
        <section>
          <h2>Reports</h2>
          <div class="toolbar">
            <label>Report
              <select id="r-type">
                <option value="class">Class schedule</option>
                <option value="faculty">Faculty schedule</option>
                <option value="room">Room schedule</option>
                <option value="availability">Room availability</option>
              </select>
            </label>
            <label id="r-program-wrap">Program <select id="r-program"></select></label>
            <label id="r-year-wrap">Year level <select id="r-year"></select></label>
            <label id="r-teacher-wrap" hidden>Teacher <select id="r-teacher"></select></label>
            <label id="r-room-wrap" hidden>Room <select id="r-room"></select></label>
            <button type="button" id="r-print">Print report</button>
          </div>
          <div id="report-output"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/schedules.js"></script>
</body>
</html>
